<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 好物推荐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #333; }
        p { color: #666; margin-bottom: 32px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6C5CE7 0%, #5A4BD1 100%);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #00B894 0%, #00A381 100%);
            color: white;
        }
        .footer { margin-top: 24px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎁</div>
        <h1>好物推荐</h1>
        <p>分享你觉得好用的物品或好吃的东西</p>
        <a href="survey.html" class="btn btn-primary">📝 填写推荐</a>
        <a href="admin.html" class="btn btn-secondary">👑 管理员后台</a>
        <div class="footer">梧意歆 · 小乖卷 · April · 哈哈额 · 33</div>
    </div>
</body>
</html>
